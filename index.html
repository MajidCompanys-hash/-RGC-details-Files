<style>

.res{border-width:2px}
.res.ok{border-color:#15803d}
.res.mid{border-color:#b45309}
.res.bad{border-color:#b91c1c}
.vt{font-size:17px;font-weight:700;margin:0 0 4px}
select,textarea{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);max-width:100%}
textarea{width:100%;margin-bottom:6px}
.f select{flex:1;min-width:140px}
.ib{border:0;background:transparent;color:var(--tx);font-size:18px;padding:0 4px;margin-inline-start:auto;cursor:pointer}
.tg{border:0;background:transparent;color:var(--tx);font-size:20px;padding:0;line-height:1;cursor:pointer}
.al{border-width:2px;border-color:var(--warn)}

.vh button{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer}
.vb{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px}
.vb img{max-width:100%;height:auto}
.vb iframe{width:100%;flex:1;min-height:60vh;border:0;background:#fff}
.fb{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.fc{font:inherit;font-size:12px;padding:4px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);cursor:pointer}
.fc.add{color:var(--ac);border-color:var(--ac)}
.w{padding-bottom:92px}
#nv{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
#nv button{flex:1;border:0;background:transparent;color:var(--mu);font:inherit;font-size:11px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
#nv button span{font-size:20px;line-height:1}
#nv button.on{color:var(--ac);font-weight:700}
svg text{fill:var(--mu);font-size:10px}
rect.bi{fill:var(--ac)}
rect.bo{fill:#dc2626}
.lg{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:4px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle}
i.bi{background:var(--ac)}
i.bo{background:#dc2626}
.fr select{max-width:150px}
@media print{#nv,#pj,#al,.tabs,.noprint,.vh,#ts{display:none!important}body{background:#fff;color:#000}.w{max-width:none;padding:0}.card{break-inside:avoid}}
.note{font-size:12px;color:var(--mu);margin-top:8px}
</style>
</head>

</div>

[3,0,"زر 3 محلات كوي/مغاسل وسجّل الأسعار (للقطعة) وسرعة التسليم"],
[6,0,"حدد الزبائن المستهدفين: سكان، عمال، فنادق، شركات"],
[8,0,"اكتب ما يميزك: سرعة، جودة، توصيل، أسعار"],
[11,1,"احسب تكلفة الأجهزة: مكابس بخار، طاولات كوي، شماعات، تغليف"],
[13,1,"احسب التكاليف الشهرية: إيجار، رواتب، كهرباء، ماء، صيانة"],

[18,1,"اكتب خطة العمل ونقطة التعادل"],

[38,2,"اطلب موافقة الدفاع المدني على المحل"],
[40,2,"اسأل البلدية عن اشتراطات التصريف والتهوية والبخار"],
[46,3,"اختر الموقع وتأكد أنه مسموح للنشاط"],

[66,4,"جهّز نظام ترقيم الملابس والإيصالات"],
[68,4,"حدد عدد العمال المطلوبين وراعِ نسبة التعمين"],
[70,4,"درّب الفريق على الكوي حسب نوع القماش والتعامل مع الزبائن"],

[70,5,"صمّم الشعار والهوية وافتح حسابات التواصل"],
[74,5,"سجّل المحل في خرائط جوجل"],
[78,5,"جهّز عروض الافتتاح (خصم، توصيل مجاني)"],

const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let S={cur:"g",g:{start:today(),done:{},custom:[]},k:{start:today(),done:{},custom:[]}},tab="today";
try{const r=localStorage.getItem("bizplan2");if(r){const o=JSON.parse(r);S.cur=o.cur||"g";S.hp=o.hp||"a";S.lead=o.lead||30;S.th=o.th||"";["g","k"].forEach(k=>{if(o[k])S[k]=Object.assign(S[k],o[k])})}}catch(e){}

const all=k=>P[k].T.map((t,i)=>({id:"t"+i,d:t[0],p:t[1],x:t[2]})).concat(S[k].custom.map(c=>({id:c.id,d:c.d,p:-1,x:c.x})));

const row=(id,txt,tag,late)=>{const X=S[S.cur];return `<div class="row ${X.done[id]?"d":""} ${late?"late":""}"><input type="checkbox" data-id="${id}" ${X.done[id]?"checked":""}><div><span class="t">${esc(txt)}</span><span class="tag">${tag}</span></div></div>`};

const FZ={
g:{S:[["s1","رسوم التراخيص والتسجيل"],["s2","تأمين الإيجار والدفعة الأولى"],["s3","الرفوف والثلاجات والكاشير"],["s4","الديكور واللوحة والتجهيز"],["s5","المخزون الأول (البضاعة)"],["s6","التسويق والافتتاح"],["s7","احتياطي طوارئ"]],R:[["r1","متوسط المبيعات اليومية (ر.ع)"]],v:"تكلفة البضاعة % من المبيعات"},
k:{S:[["s1","رسوم التراخيص والتسجيل"],["s2","تأمين الإيجار والدفعة الأولى"],["s3","مكابس البخار وطاولات الكوي والأجهزة"],["s4","الديكور واللوحة والتجهيز"],["s5","المستلزمات الأولى (شماعات، أكياس...)"],["s6","التسويق والافتتاح"],["s7","احتياطي طوارئ"]],R:[["r1","عدد القطع المكوية يومياً"],["r2","سعر القطعة (ر.ع)"]],v:"مواد وتشغيل % من الإيرادات (ماء، منظفات، كهرباء)"}};
const fmt=n=>(Math.round(n*10)/10).toLocaleString("en-US")+" ر.ع";
function fzHtml(k){const F=S[k].fz||{},C=FZ[k];
 const inp=(key,l,ph)=>`<div class="fr"><label>${l}</label><input type="number" min="0" step="any" inputmode="decimal" data-f="${key}" placeholder="${ph||0}" value="${F[key]||""}"></div>`;
 return `<div class="card"><h2>١. تكاليف التأسيس (مرة واحدة، ر.ع)</h2>${C.S.map(x=>inp(x[0],x[1])).join("")}</div>
<div class="card"><h2>٢. المصاريف الشهرية الثابتة (ر.ع)</h2>${FM.map(x=>inp(x[0],x[1])).join("")}</div>
<div class="card"><h2>٣. الإيرادات المتوقعة</h2>${C.R.map(x=>inp(x[0],x[1])).join("")}${inp("d","أيام العمل في الشهر",30)}${inp("v",C.v,0)}</div>
<div id="fzr">${fzRes(k)}</div>
<p class="note">النتيجة تعتمد على أرقامك التقديرية وليست ضماناً للنجاح. الأفضل أن تقدّر المبيعات بتحفظ بعد زيارة محلات مشابهة ومراقبة حركتها.</p>`}
function fzRes(k){const F=S[k].fz||{},C=FZ[k],g=x=>+F[x]||0;

 let cls,vt,vx;
 if(!rev){cls="bad";vt="⚠️ أدخل الإيرادات المتوقعة";vx="لا يمكن الحكم على النجاح دون تقدير المبيعات."}
 else if(net<=0){cls="bad";vt="❌ بهذه الأرقام المشروع يخسر";vx=`تحتاج مبيعات يومية لا تقل عن ${fmt(bed)} لتغطية المصاريف. راجع الإيجار والرواتب أو ارفع المبيعات.`}
 else if(pay<=18&&pess>=0){cls="ok";vt="✅ جدوى جيدة";vx=`يعود رأس المال خلال ${pay.toFixed(1)} شهر، ويبقى المشروع رابحاً حتى لو نزلت المبيعات 20%.`}
